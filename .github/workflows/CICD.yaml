name: CI for tiNi_Wifi update_branch
on:
    push:
        branches:
            - update
    pull_request:
        branches:
            - update
jobs:
    check:
        name: Check repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Check required files
              run: |
                test -f docker-compose.yml
                test -d reverse-proxy
    validate:
        name: Validate docker-compose
        runs-on: ubuntu-latest
        needs: check
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Validate docker-compose config
              run: docker compose config
    build:
        name: Build docker images
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Create SSL certificates
              run: |
                mkdir -p reverse-proxy/certs
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout reverse-proxy/certs/tiNi-Wifi.key \
                  -out reverse-proxy/certs/tiNi-Wifi.crt \
                  -subj "/CN=tiNi-Wifi/O=tiNi-Wifi/C=VN" \
                  -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:::1"
            - name: Verify certificates created
              run: |
                ls -la reverse-proxy/certs/
                test -f reverse-proxy/certs/tiNi-Wifi.key
                test -f reverse-proxy/certs/tiNi-Wifi.crt
            - name: Build docker images
              run: docker compose build
    test:
        name: Test services
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Create SSL certificates
              run: |
                mkdir -p reverse-proxy/certs
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout reverse-proxy/certs/tiNi-Wifi.key \
                  -out reverse-proxy/certs/tiNi-Wifi.crt \
                  -subj "/CN=tiNi-Wifi/O=tiNi-Wifi/C=VN" \
                  -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:::1"
            - name: Start services
              run: docker compose up -d
            - name: Waiting for services to be ready
              run: |
                echo "Waiting for services to start..."
                sleep 10
                docker compose ps
            - name: Check services health
              run: |
                set -e
                # Kiểm tra container đã chạy chưa
                echo "Checking containers status"
                docker compose ps
                if ! docker compose ps | grep -q "Up"; then
                  echo "Some containers are not running"
                  exit 1
                fi
                echo "All containers are running"
                # Kiểm tra truy cập các services
                echo "Checking services accessibility"
                check_service() {
                  local name=$1
                  local url=$2
                  if curl -f "$url" > /dev/null 2>&1; then
                    echo "$name accessible"
                  else
                    echo "$name not accessible"
                  fi
                }
                check_service "reverse-proxy" "http://localhost:80"
                check_service "campaign-api" "http://localhost:3000"
                check_service "tracking-service" "http://localhost:3001"