name: CI for tiNi_Wifi update_branch
on:
    push:
        branches:
            - update
    pull_request:
        branches:
            - update
jobs:
    check:
        name: Check repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Check required files
              run: |
                test -f docker-compose.yml
                test -d reverse-proxy
    validate:
        name: Validate docker-compose
        runs-on: ubuntu-latest
        needs: check
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Validate docker-compose config
              run: docker compose config
    build:
        name: Build docker images
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Create SSL certificates
              run: |
                mkdir -p reverse-proxy/certs
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout reverse-proxy/certs/tiNi-Wifi.key \
                  -out reverse-proxy/certs/tiNi-Wifi.crt \
                  -subj "/CN=tiNi-Wifi/O=tiNi-Wifi/C=VN" \
                  -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:::1"
            - name: Verify certificates created
              run: |
                ls -la reverse-proxy/certs/
                test -f reverse-proxy/certs/tiNi-Wifi.key
                test -f reverse-proxy/certs/tiNi-Wifi.crt
            - name: Build docker images
              run: docker compose build
    test:
        name: Test services
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Check source code
              uses: actions/checkout@v4
            - name: Create SSL certificates
              run: |
                mkdir -p reverse-proxy/certs
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout reverse-proxy/certs/tiNi-Wifi.key \
                  -out reverse-proxy/certs/tiNi-Wifi.crt \
                  -subj "/CN=tiNi-Wifi/O=tiNi-Wifi/C=VN" \
                  -addtext "subjectAltName=DNS:localhost,DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:::1"
            - name: Start services
              run: docker compose up -d
              

   