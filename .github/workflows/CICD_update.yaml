name: CI for tiNi_Wifi update_branch
on:
    push:
        branches:
            - update
    pull_request:
        branches:
            - update
jobs:
    check-code:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

    validate-docker-compose:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Validate docker-compose
              run: docker compose config
    build-docker-images:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
            - name: Create SSL certificates for reverse-proxy
              run: |
                mkdir -p reverse-proxy/certs
                openssl req -x509 -nodes -days 365 \
                  -newkey rsa:2048 \
                  -keyout reverse-proxy/certs/tiNi-Wifi.key \
                  -out reverse-proxy/certs/tiNi-Wifi.crt \
                  -subj "/CN=tiNi-Wifi/O=tiNi-Wifi/C=VN" \
                  -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:::1"
            - name: Verify certificates created
              run: |
                ls -la reverse-proxy/certs/
                test -f reverse-proxy/certs/tiNi-Wifi.key
                test -f reverse-proxy/certs/tiNi-Wifi.crt
            - name: Docker compose build and run
              run: docker compose up -d --build
    thong-bao:
        runs-on: ubuntu-latest
        needs:
            - check-code
            - validate-docker-compose
            - build-docker-images
        steps:
            - name: Thong bao
              run: echo "CI for tiNi_Wifi update branch da chay thanh cong"
